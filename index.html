<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUNARO — LNR Mining</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f59b;
      --primary-glow: rgba(0, 245, 155, 0.45);
      --primary-dark: #00b371;
      --gold-1: #ffe682;
      --gold-2: #d4a631;
      --gold-3: #8a6211;
      --bg-dark: #020907;
      --bg-card: rgba(0, 24, 18, 0.72);
      --border-card: rgba(0, 245, 155, 0.28);
      --text-muted: #96aca7;
      --text-dim: #5c7873;
      --font-main: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: var(--font-main);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 960px;
      background: #020907;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 245, 155, 0.12);
    }

    @media (min-width: 500px) and (min-height: 700px) {
      .app-container {
        height: 92vh;
        border-radius: 40px;
        border: 2px solid rgba(0, 245, 155, 0.25);
        box-shadow: 0 0 80px rgba(0, 245, 155, 0.2), 0 25px 50px rgba(0, 0, 0, 0.8);
      }
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0.95;
      filter: contrast(1.08) brightness(1.02);
      transition: transform 0.4s ease;
    }

    .bg-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(2, 9, 7, 0.95) 0%,
        rgba(2, 9, 7, 0.45) 25%,
        rgba(2, 9, 7, 0.15) 50%,
        rgba(2, 9, 7, 0.35) 75%,
        rgba(2, 9, 7, 0.98) 100%
      );
      z-index: 2;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 10;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(2, 9, 7, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 245, 155, 0.12);
    }

    .top-action-btn {
      background: none;
      border: none;
      color: #e0ece9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .top-action-btn:active {
      transform: scale(0.9);
      background: rgba(0, 245, 155, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(0, 245, 155, 0.4);
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(0, 245, 155, 0.8));
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .main-content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 8px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar {
      display: none;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .level-speed-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .level-card {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .level-gem-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 2px;
      background: radial-gradient(circle, rgba(0, 245, 155, 0.3) 0%, rgba(0, 30, 20, 0.8) 100%);
      border: 1.5px solid var(--primary);
      box-shadow: 0 0 18px rgba(0, 245, 155, 0.45);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .level-gem-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .level-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .level-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .progress-bar-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .progress-track {
      width: 105px;
      height: 7px;
      background: #092c22;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 245, 155, 0.4);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .progress-fill {
      width: 48%;
      height: 100%;
      background: linear-gradient(90deg, #00f59b 0%, #00d287 100%);
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 245, 155, 0.8);
      transition: width 0.5s ease;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 700;
      color: #b5d5ce;
    }

    .speed-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: rgba(0, 32, 24, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 245, 155, 0.4);
      border-radius: 18px;
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 800;
      box-shadow: 0 0 14px rgba(0, 245, 155, 0.12);
      width: fit-content;
      cursor: pointer;
      transition: all 0.2s;
    }
    .speed-badge:active {
      transform: scale(0.96);
      background: rgba(0, 48, 36, 0.9);
    }

    .wallet-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      background: rgba(0, 22, 17, 0.82);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(0, 245, 155, 0.5);
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 245, 155, 0.16);
      transition: all 0.25s;
    }

    .wallet-chip:hover {
      border-color: var(--primary);
      box-shadow: 0 0 24px rgba(0, 245, 155, 0.35);
    }

    .wallet-chip:active {
      transform: scale(0.96);
    }

    .wallet-icon-svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
      filter: drop-shadow(0 0 6px rgba(0, 245, 155, 0.7));
    }

    .wallet-address {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.4px;
    }

    .wallet-chevron {
      color: #88a7a0;
      display: flex;
      align-items: center;
    }

    .balance-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 6px;
      position: relative;
      z-index: 6;
    }

    .balance-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #a4beba;
      margin-bottom: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .total-balance-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 22px;
      background: rgba(0, 20, 15, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 155, 0.45);
      border-radius: 32px;
      box-shadow: 0 0 22px rgba(0, 245, 155, 0.18), inset 0 0 12px rgba(0, 245, 155, 0.08);
    }

    .gold-coin-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff4a8 0%, #e6b73a 50%, #855407 100%);
      border: 1.5px solid #f8e182;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(230, 183, 58, 0.5);
      color: #5c3b03;
      font-weight: 900;
      font-size: 13px;
    }

    .total-number {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .currency-tag {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 245, 155, 0.6);
    }

    .stats-card {
      width: 100%;
      margin-top: 10px;
      padding: 10px 8px;
      display: flex;
      align-items: center;
      background: rgba(0, 22, 17, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 155, 0.3);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .stat-col {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 2px 8px;
    }

    .stat-col:first-child {
      border-right: 1px solid rgba(0, 245, 155, 0.2);
    }

    .stat-icon-wrap {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      filter: drop-shadow(0 0 6px rgba(0, 245, 155, 0.6));
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-name {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #8faea8;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }

    .stat-ticker {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
    }

    .hero-stage {
      position: relative;
      flex: 1;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      cursor: pointer;
    }

    .coin-interactive-wrap {
      position: relative;
      width: min(72vw, 320px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .coin-interactive-wrap:active {
      transform: scale(0.96);
    }

    .tap-particle {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 12px rgba(0, 245, 155, 0.9), 0 0 24px rgba(0, 245, 155, 0.5);
      pointer-events: none;
      animation: floatUpFade 1.1s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
      z-index: 50;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6) translateY(0);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15) translateY(-25px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1) translateY(-90px);
      }
    }

    .coin-glow-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 245, 155, 0.35) 0%, rgba(0, 245, 155, 0.05) 60%, transparent 80%);
      filter: blur(16px);
      animation: pulseGlow 3.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    .claim-container {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 4px 4px 10px;
    }

    .claim-btn {
      position: relative;
      width: 100%;
      height: 56px;
      background: linear-gradient(180deg, #03e498 0%, #009e6a 100%);
      border: 1.5px solid #4affc7;
      border-radius: 18px;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 
        0 0 30px rgba(0, 245, 155, 0.45),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.55),
        inset 0 -2px 5px rgba(0, 80, 50, 0.6);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }

    .claim-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 70%
      );
      transform: rotate(25deg);
      animation: buttonShine 4s infinite linear;
      pointer-events: none;
    }

    @keyframes buttonShine {
      0% { transform: translateX(-100%) rotate(25deg); }
      25% { transform: translateX(100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    .claim-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(0, 245, 155, 0.3);
    }

    .claim-btn.disabled {
      opacity: 0.55;
      filter: grayscale(0.4);
      cursor: not-allowed;
    }

    .bottom-nav {
      position: relative;
      z-index: 10;
      height: 66px;
      background: rgba(1, 10, 8, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0, 245, 155, 0.22);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0 6px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .nav-icon-container {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item.active .nav-icon-container {
      filter: drop-shadow(0 0 8px var(--primary));
      transform: translateY(-2px);
    }

    .nav-item.active .nav-label {
      color: var(--primary);
      text-shadow: 0 0 8px rgba(0, 245, 155, 0.4);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 42px;
      height: 3px;
      background: var(--primary);
      border-radius: 4px 4px 0 0;
      box-shadow: 0 0 12px var(--primary);
    }

    .nav-item.special-btn .nav-icon-container {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 245, 155, 0.15);
      border: 1px solid rgba(0, 245, 155, 0.4);
      color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 245, 155, 0.2);
    }

    .toast-msg {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(2, 25, 19, 0.95);
      border: 1.5px solid var(--primary);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 245, 155, 0.4);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: #021812;
      border: 1.5px solid var(--primary);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 0 50px rgba(0, 245, 155, 0.25);
      position: relative;
      text-align: center;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #96aca7;
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-icon-header {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0, 245, 155, 0.15);
      border: 1.5px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.3);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-body {
      font-size: 14px;
      color: #b1c7c2;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(180deg, #00f59b 0%, #00a86b 100%);
      border: none;
      border-radius: 14px;
      color: #02120d;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.35);
      transition: all 0.2s;
    }

    .modal-btn:active {
      transform: scale(0.97);
    }

    .wallet-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    .wallet-option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 30, 22, 0.7);
      border: 1px solid rgba(0, 245, 155, 0.25);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wallet-option-item:hover {
      border-color: var(--primary);
      background: rgba(0, 45, 32, 0.85);
    }

    .wallet-option-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="bg-layer">
      <img src="assets/lunaro_hero_bg.jpg" alt="Lunaro Mining Stage" class="bg-image">
      <div class="bg-gradient-overlay"></div>
      <canvas id="particles-canvas"></canvas>
    </div>

    <header class="topbar">
      <button class="top-action-btn" id="btnCloseApp" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="12" fill="#003828" stroke="#00f59b" stroke-width="2.5"/>

    <div class="toast-msg" id="toastMsg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--primary)">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <button class="modal-close" id="btnModalClose">&times;</button>
        <div class="modal-icon-header" id="modalIcon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 14 14"></polyline>
          </svg>
        </div>
        <h3 class="modal-title" id="modalTitle">Modal Header</h3>
        <p class="modal-body" id="modalBody">Description text goes here.</p>
        <div id="modalExtraContent"></div>
        <button class="modal-btn" id="btnModalAction">Confirm</button>
      </div>

  </div>

  <script>
    const state = {
      totalBalance: 12458.32,
      walletBalance: 11925.65,
      minedUnclaimed: 342.67,
      miningSpeed: 2.5,
      miningRatePerSec: 0.08,
      level: 3,
      levelProgress: 48,
      walletAddress: "UQCN...iD7",
      isWalletConnected: true,
      lastClaimTime: Date.now()
    };

    const totalBalanceEl = document.getElementById('totalBalance');
    const walletBalanceEl = document.getElementById('walletBalance');
    const minedAmountEl = document.getElementById('minedAmount');
    const btnClaim = document.getElementById('btnClaim');
    const heroStage = document.getElementById('heroStage');
    const toastMsg = document.getElementById('toastMsg');
    const toastText = document.getElementById('toastText');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalIcon = document.getElementById('modalIcon');
    const modalExtra = document.getElementById('modalExtraContent');
    const btnModalClose = document.getElementById('btnModalClose');
    const btnModalAction = document.getElementById('btnModalAction');
    const walletChip = document.getElementById('walletChip');

    function formatNumber(num) {
      return num.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    let toastTimeout;
    function showToast(message) {
      toastText.textContent = message;
      toastMsg.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2200);
    }

    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTap() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      },
      playClaim() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [440, 554, 659, 880];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.07);
            osc.stop(this.ctx.currentTime + idx * 0.07 + 0.25);
          });
        } catch (e) {}
      }
    };

    setInterval(() => {
      const increment = (state.miningRatePerSec * (state.miningSpeed / 2.5)) / 2;
      state.minedUnclaimed += increment;
      minedAmountEl.textContent = formatNumber(state.minedUnclaimed);
      
      if (state.minedUnclaimed > 0.01) {
        btnClaim.classList.remove('disabled');
      }
    }, 500);

    heroStage.addEventListener('pointerdown', (e) => {
      AudioEngine.playTap();
      
      const tapReward = 0.05 * state.miningSpeed;
      state.minedUnclaimed += tapReward;
      minedAmountEl.textContent = formatNumber(state.minedUnclaimed);

      const rect = heroStage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const particle = document.createElement('div');
      particle.className = 'tap-particle';
      particle.textContent = `+${tapReward.toFixed(2)} LNR`;
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      heroStage.appendChild(particle);

      setTimeout(() => particle.remove(), 1100);
    });

    btnClaim.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.minedUnclaimed <= 0.01) {
        showToast("No mined LNR available to claim yet!");
        return;
      }

      AudioEngine.playClaim();
      const claimedAmount = state.minedUnclaimed;
      
      state.walletBalance += claimedAmount;
      state.totalBalance += claimedAmount;
      state.minedUnclaimed = 0.00;

      minedAmountEl.textContent = "0.00";
      walletBalanceEl.textContent = formatNumber(state.walletBalance);
      totalBalanceEl.textContent = formatNumber(state.totalBalance);

      triggerConfetti();

      showToast(`Successfully claimed +${formatNumber(claimedAmount)} LNR!`);
    });

    walletChip.addEventListener('click', () => {
      modalIcon.innerHTML = `
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="4" />
          <path d="M16 12a2 2 0 1 0 4 0" />
        </svg>
      `;
      modalTitle.textContent = "TON Wallet";
      modalBody.textContent = `Connected Address: ${state.walletAddress}`;
      modalExtra.innerHTML = `
        <div class="wallet-list">
          <div class="wallet-option-item">
            <div class="wallet-option-left">
              <span>💎 Tonkeeper</span>
            </div>
            <span style="color: var(--primary); font-size:12px; font-weight:800;">CONNECTED</span>
          </div>
          <div class="wallet-option-item">
            <div class="wallet-option-left">
              <span>✈️ Telegram Wallet</span>
            </div>
            <span style="color: #96aca7; font-size:12px;">Switch</span>
          </div>
        </div>
      `;
      btnModalAction.textContent = "Disconnect Wallet";
      btnModalAction.onclick = () => {
        showToast("Wallet disconnected");
        modalOverlay.classList.remove('active');
      };
      modalOverlay.classList.add('active');
    });

    document.getElementById('speedBadge').addEventListener('click', () => {
      modalIcon.innerHTML = `
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      `;
      modalTitle.textContent = "Mining Boosts";
      modalBody.textContent = `Current multiplier: ${state.miningSpeed}×. Upgrade your hardware or invite friends to accelerate mining rate!`;
      modalExtra.innerHTML = `
        <div style="background:rgba(0,30,22,0.7); padding:12px; border-radius:14px; border:1px solid rgba(0,245,155,0.2); margin-bottom:15px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="color:#b1c7c2;">Next Tier (Level 4):</span>
            <strong style="color:var(--primary);">3.5× Speed</strong>
          </div>
          <div style="font-size:12px; color:#8faea8;">Cost: 500 LNR or 3 Invites</div>
        </div>
      `;
      btnModalAction.textContent = "Upgrade Now";
      btnModalAction.onclick = () => {
        state.miningSpeed = 3.5;
        document.getElementById('speedBadge').querySelector('span').textContent = "3.5× Mining Speed";
        showToast("Upgraded to 3.5× Mining Speed!");
        modalOverlay.classList.remove('active');
      };
      modalOverlay.classList.add('active');
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        if (tab !== 'mine') {
          showToast(`${btn.querySelector('.nav-label').textContent} section opened`);
        }
      });
    });

    document.getElementById('btnCloseApp').onclick = () => showToast("Closing Lunaro mini-app...");
    document.getElementById('btnTopDropdown').onclick = () => showToast("Network: TON Mainnet");
    document.getElementById('btnTopMenu').onclick = () => {
      modalIcon.innerHTML = `
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      `;
      modalTitle.textContent = "About LUNARO";
      modalBody.textContent = "LUNARO is a next-generation high-yield Web3 mining protocol on the TON blockchain. Farm, stake, and earn LNR tokens.";
      modalExtra.innerHTML = "";
      btnModalAction.textContent = "Got it";
      btnModalAction.onclick = () => modalOverlay.classList.remove('active');
      modalOverlay.classList.add('active');
    };

    btnModalClose.onclick = () => modalOverlay.classList.remove('active');
    modalOverlay.onclick = (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let confettiList = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.8 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.4 - 0.1,
        opacity: Math.random() * 0.8 + 0.2
      });
    }

    function triggerConfetti() {
      for (let i = 0; i < 70; i++) {
        confettiList.push({
          x: canvas.width / 2,
          y: canvas.height * 0.55,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 1) * 12 - 3,
          size: Math.random() * 5 + 3,
          color: Math.random() > 0.4 ? '#00f59b' : '#ffe682',
          alpha: 1,
          gravity: 0.32,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 15
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00f59b';
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let i = confettiList.length - 1; i >= 0; i--) {
        const c = confettiList[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += c.gravity;
        c.alpha -= 0.016;
        c.rotation += c.rotSpeed;

        if (c.alpha <= 0) {
          confettiList.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = c.alpha;
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
        ctx.restore();
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(animateParticles);
    }

    animateParticles();
  </script>
