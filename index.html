<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>LUNARO — Automatic Mining</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02010a;
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

    --bg:#02010a;

    --purple:#8f33ff;
    --purple2:#c75aff;

    --blue:#277cff;
    --cyan:#2be9ff;

    --gold:#ffd45c;

    --white:#ffffff;

    --muted:#aca5dc;

}


/* =========================================================
   APP
========================================================= */

.app{

    position:relative;

    width:100%;
    max-width:620px;

    min-height:100vh;

    margin:auto;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 22%,
            rgba(120,30,255,.38),
            transparent 28%
        ),

        radial-gradient(
            circle at 4% 38%,
            rgba(32,69,255,.20),
            transparent 25%
        ),

        radial-gradient(
            circle at 96% 45%,
            rgba(118,32,255,.20),
            transparent 25%
        ),

        linear-gradient(
            180deg,
            #02010a 0%,
            #060016 48%,
            #020108 100%
        );

}


/* stars */

.app::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.65;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.9) 0 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(180,120,255,.9) 0 1px,
            transparent 1.5px
        );

    background-size:
        130px 140px,
        210px 230px;

    background-position:
        20px 20px,
        70px 50px;

}


/* =========================================================
   SCREEN
========================================================= */

.screen{

    position:relative;

    z-index:2;

    padding:
        18px
        14px
        125px;

}


/* =========================================================
   TOP
========================================================= */

.topbar{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

}


/* wallet */

.wallet{

    min-height:72px;

    border:
        1px solid
        rgba(118,57,234,.75);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(22,11,54,.95),
            rgba(5,3,18,.95)
        );

    display:flex;

    align-items:center;

    padding:
        9px 10px;

    gap:9px;

    box-shadow:
        0 0 22px
        rgba(111,40,255,.16),

        inset 0 0 20px
        rgba(150,60,255,.06);

}


.wallet-icon{

    width:40px;
    height:40px;

    border-radius:13px;

    display:grid;

    place-items:center;

    color:#29e6ff;

    background:
        linear-gradient(
            145deg,
            #5cdfff,
            #667dff
        );

    color:#10102c;

    font-size:22px;

    box-shadow:
        0 0 16px
        rgba(55,210,255,.35);

}


.wallet-info{

    flex:1;

    min-width:0;

}


.wallet-title{

    color:#22e7df;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;

}


.wallet-address{

    margin-top:5px;

    font-size:13px;

    color:#fff;

}


.wallet-arrow{

    color:#d19aff;

    font-size:25px;

}


/* level */

.level{

    min-height:72px;

    border:
        1px solid
        rgba(126,60,235,.8);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(20,9,49,.95),
            rgba(5,3,18,.95)
        );

    padding:
        8px 13px;

    text-align:center;

    box-shadow:
        0 0 22px
        rgba(111,40,255,.14);

}


.level-title{

    font-size:20px;

    font-weight:900;

    color:#d89dff;

    text-shadow:
        0 0 15px
        rgba(197,82,255,.6);

}


.level-bar{

    width:100%;

    height:12px;

    margin-top:7px;

    background:#20144b;

    border-radius:999px;

    overflow:hidden;

}


.level-bar-fill{

    width:34.8%;

    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #842dff,
            #db65ff
        );

    box-shadow:
        0 0 13px #a945ff;

}


.level-count{

    margin-top:3px;

    font-size:9px;

    color:#c5b9eb;

}


/* =========================================================
   LOGO
========================================================= */

.brand{

    text-align:center;

    margin:
        14px 0 0;

}


.brand-row{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:11px;

}


.brand-moon{

    width:45px;
    height:45px;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle at 30% 28%,
            #ffffff,
            #d66aff 28%,
            #7130ff 63%,
            #18004b 100%
        );

    box-shadow:
        0 0 20px #aa42ff,
        0 0 45px
        rgba(138,43,255,.5);

}


.brand-moon::after{

    content:"";

    position:absolute;

    width:35px;
    height:35px;

    top:-3px;
    right:-7px;

    border-radius:50%;

    background:#05020e;

}


.brand-name{

    font-size:34px;

    line-height:1;

    font-weight:900;

    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 12px #ffffff66,
        0 0 30px #a43aff99;

}


.brand-sub{

    margin-top:4px;

    font-size:9px;

    letter-spacing:5px;

    color:#aaa2d7;

}


/* =========================================================
   HERO PLANET
========================================================= */

.hero{

    position:relative;

    height:345px;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* glow */

.hero-glow{

    position:absolute;

    width:315px;
    height:315px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(178,60,255,.37),
            rgba(86,25,255,.15) 50%,
            transparent 72%
        );

    filter:blur(16px);

}


/* back ring */

.back-ring{

    position:absolute;

    width:355px;
    height:115px;

    border:
        2px solid
        rgba(135,62,255,.45);

    border-radius:50%;

    transform:
        rotate(8deg);

}


/* planet */

.planet{

    position:relative;

    width:245px;
    height:245px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 31% 27%,
            #8850b7 0%,
            #4b1c75 27%,
            #1c092f 60%,
            #05020b 100%
        );

    box-shadow:

        0 0 22px #d15cff,

        0 0 60px
        rgba(137,29,255,.78),

        inset
        -27px -24px 50px
        rgba(0,0,0,.9);

}


/* crater texture */

.planet::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    opacity:.7;

    background:

        radial-gradient(
            circle at 19% 31%,
            #0b0312 0 9px,
            transparent 10px
        ),

        radial-gradient(
            circle at 52% 19%,
            #26083d 0 12px,
            transparent 13px
        ),

        radial-gradient(
            circle at 69% 32%,
            #09020f 0 8px,
            transparent 9px
        ),

        radial-gradient(
            circle at 34% 68%,
            #25073b 0 14px,
            transparent 15px
        ),

        radial-gradient(
            circle at 70% 63%,
            #06010d 0 11px,
            transparent 12px
        );

}


/* outer glow */

.planet::after{

    content:"";

    position:absolute;

    inset:-6px;

    border-radius:50%;

    border:
        2px solid
        #d766ff;

    box-shadow:

        0 0 13px #ff6dff,

        0 0 34px #8e2fff;

}


/* orbit */

.orbit{

    position:absolute;

    z-index:4;

    width:330px;
    height:102px;

    border:
        4px solid
        #b84dff;

    border-radius:50%;

    transform:
        rotate(-13deg);

    box-shadow:

        0 0 10px #ff53ff,
        0 0 32px #8129ff;

}


/* orbit highlight */

.orbit::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    border-top:
        2px solid
        #fff;

    opacity:.55;

}


/* LNR */

.hero-lnr{

    position:absolute;

    z-index:6;

    font-size:81px;

    font-weight:1000;

    letter-spacing:-5px;

    color:#e9d6ff;

    transform:
        skew(-7deg);

    text-shadow:

        2px 2px 0 #7c24c2,

        4px 4px 0 #4a117d,

        0 0 10px #ffffff,

        0 0 25px #d263ff,

        0 0 55px #7625ff;

}


/* =========================================================
   TOTAL BALANCE
========================================================= */

.total{

    text-align:center;

    margin-top:-4px;

}


.total-title{

    font-size:21px;

    color:#c5bce9;

    letter-spacing:2px;

}


.total-number{

    margin-top:4px;

    font-size:52px;

    line-height:1;

    font-weight:900;

    color:#fff;

    text-shadow:

        0 0 10px #ffffff,

        0 0 28px
        rgba(177,72,255,.75);

}


.total-token{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:7px;

    color:#ffd867;

    font-size:19px;

    font-weight:900;

}


.token-icon{

    width:28px;
    height:28px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#35125e;

    border:
        1px solid
        #b04fff;

    color:#d968ff;

    box-shadow:
        0 0 12px
        rgba(162,66,255,.45);

}


/* =========================================================
   STATS
========================================================= */

.stats{

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    border:
        1px solid
        rgba(101,52,210,.7);

    border-radius:25px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(10,5,29,.93),
            rgba(3,2,12,.96)
        );

    box-shadow:
        0 0 25px
        rgba(92,31,220,.12);

}


.stat{

    min-height:140px;

    padding:
        15px 5px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}


.stat + .stat{

    border-left:
        1px solid
        rgba(55,32,90,.8);

}


.stat-icon{

    width:46px;
    height:46px;

    border-radius:50%;

    display:grid;

    place-items:center;

    font-size:24px;

    background:
        radial-gradient(
            circle,
            rgba(137,48,255,.45),
            rgba(13,4,33,.9)
        );

    border:
        1px solid
        rgba(177,76,255,.55);

    box-shadow:
        0 0 16px
        rgba(128,43,255,.32);

}


.stat:nth-child(2) .stat-icon{

    color:#ffd85b;

}


.stat:nth-child(3) .stat-icon{

    color:#d05cff;

}


.stat-name{

    margin-top:10px;

    font-size:10px;

    color:#aea8dc;

}


.stat-value{

    margin-top:7px;

    font-size:23px;

    font-weight:900;

}


.stat:nth-child(2) .stat-value{

    color:#ffd65c;

}


.stat-unit{

    margin-top:2px;

    font-size:10px;

    color:#aaa4d2;

}


/* =========================================================
   CLAIM
========================================================= */

.claim-wrap{

    margin-top:27px;

}


.claim{

    position:relative;

    width:100%;

    height:72px;

    border-radius:40px;

    border:
        2px solid
        #ae46ff;

    background:
        linear-gradient(
            100deg,
            #3a12a7,
            #8424ef 48%,
            #4315ac
        );

    color:#fff;

    display:flex;

    align-items:center;

    box-shadow:

        0 0 13px #8c2aff,

        0 0 35px
        rgba(143,38,255,.48),

        inset 0 0 22px
        rgba(255,255,255,.13);

    overflow:hidden;

}


.claim::after{

    content:"";

    position:absolute;

    top:0;

    left:-70%;

    width:55%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        claimShine 4s infinite;

}


@keyframes claimShine{

    0%,30%{
        left:-70%;
    }

    60%,100%{
        left:150%;
    }

}


.claim-icon{

    margin-left:16px;

    width:49px;
    height:49px;

    border-radius:50%;

    display:grid;

    place-items:center;

    border:
        1px solid
        rgba(255,255,255,.4);

    background:
        rgba(35,0,90,.3);

    font-size:26px;

}


.claim-text{

    flex:1;

    text-align:center;

    font-size:27px;

    font-weight:900;

    letter-spacing:2px;

}


.claim-arrow{

    margin-right:18px;

    font-size:35px;

    color:#dfb4ff;

}


/* =========================================================
   AUTO STATUS
========================================================= */

.auto{

    margin:18px 0 22px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    color:#25e8ff;

    font-size:11px;

    letter-spacing:.5px;

}


.auto::before,
.auto::after{

    content:"";

    width:95px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #25e8ff
        );

}


.auto::after{

    transform:rotate(180deg);

}


.auto-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#25e8ff;

    box-shadow:
        0 0 10px #25e8ff;

}


/* =========================================================
   INFO
========================================================= */

.info-card{

    min-height:90px;

    border-radius:22px;

    border:
        1px solid
        rgba(88,42,172,.7);

    background:

        radial-gradient(
            circle at 75% 50%,
            rgba(106,27,255,.22),
            transparent 32%
        ),

        linear-gradient(
            110deg,
            rgba(8,3,24,.96),
            rgba(6,3,21,.88)
        );

    display:flex;

    align-items:center;

    padding:
        13px 17px;

    position:relative;

    overflow:hidden;

}


.info-logo{

    width:55px;
    height:55px;

    border-radius:50%;

    display:grid;

    place-items:center;

    border:
        1px solid
        #ba5aff;

    color:#e4acff;

    font-weight:900;

    font-size:18px;

    box-shadow:
        0 0 18px
        rgba(188,76,255,.4);

}


.info-text{

    margin-left:13px;

}


.info-title{

    font-size:18px;

    font-weight:900;

}


.info-sub{

    margin-top:3px;

    color:#8f79d6;

    font-size:10px;

}


.future{

    margin-left:auto;

    color:#a56aff;

    font-size:10px;

    text-align:right;

}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    z-index:20;

    left:50%;

    bottom:0;

    transform:
        translateX(-50%);

    width:100%;

    max-width:620px;

    height:92px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    padding:
        8px
        8px
        14px;

    background:
        rgba(3,2,12,.97);

    border-top:
        1px solid
        rgba(77,42,130,.35);

    backdrop-filter:
        blur(18px);

}


.nav-item{

    position:relative;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#a5a1d6;

    background:none;

    font-size:11px;

}


.nav-icon{

    font-size:26px;

}


.nav-item.active{

    color:#f4eaff;

    text-shadow:
        0 0 10px #ad50ff;

}


.nav-item.active .nav-icon{

    color:#c95bff;

    filter:
        drop-shadow(
            0 0 8px #bc43ff
        );

}


.nav-item.active::after{

    content:"";

    position:absolute;

    bottom:0;

    width:75%;

    height:3px;

    border-radius:10px;

    background:#c04bff;

    box-shadow:
        0 0 10px #c04bff,
        0 0 20px #8e2cff;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:430px){

    .screen{

        padding:
            13px
            11px
            115px;

    }


    .wallet,
    .level{

        min-height:63px;

    }


    .wallet-icon{

        width:34px;
        height:34px;

        font-size:18px;

    }


    .wallet-title{

        font-size:8px;

    }


    .wallet-address{

        font-size:11px;

    }


    .level-title{

        font-size:17px;

    }


    .brand{

        margin-top:16px;

    }


    .brand-moon{

        width:41px;
        height:41px;

    }


    .brand-name{

        font-size:28px;

        letter-spacing:4px;

    }


    .brand-sub{

        font-size:7px;

    }


    .hero{

        height:295px;

    }


    .planet{

        width:210px;
        height:210px;

    }


    .hero-glow{

        width:280px;
        height:280px;

    }


    .orbit{

        width:285px;
        height:89px;

    }


    .back-ring{

        width:320px;
        height:105px;

    }


    .hero-lnr{

        font-size:68px;

    }


    .total-title{

        font-size:18px;

    }


    .total-number{

        font-size:45px;

    }


    .total-token{

        font-size:18px;

    }


    .stats{

        margin-top:25px;

        border-radius:20px;

    }


    .stat{

        min-height:122px;

    }


    .stat-icon{

        width:40px;
        height:40px;

        font-size:20px;

    }


    .stat-name{

        font-size:8px;

    }


    .stat-value{

        font-size:19px;

    }


    .stat-unit{

        font-size:9px;

    }


    .claim{

        height:65px;

    }


    .claim-icon{

        width:43px;
        height:43px;

        margin-left:11px;

        font-size:22px;

    }


    .claim-text{

        font-size:23px;

    }


    .claim-arrow{

        margin-right:12px;

        font-size:29px;

    }


    .auto{

        font-size:9px;

    }


    .auto::before,
    .auto::after{

        width:70px;

    }


    .future{

        display:none;

    }


    .info-card{

        min-height:75px;

    }


    .info-logo{

        width:48px;
        height:48px;

    }


    .info-title{

        font-size:16px;

    }


    .nav{

        height:82px;

    }


    .nav-icon{

        font-size:23px;

    }

}

</style>

</head>

<body>


<div class="app">


<main class="screen">


<!-- ======================================================
     TOP
======================================================= -->

<div class="topbar">


    <!-- WALLET -->

    <div class="wallet">

        <div class="wallet-icon">
            ◈
        </div>

        <div class="wallet-info">

            <div class="wallet-title">
                ● Wallet Connected
            </div>

            <div class="wallet-address">
                UQCN...iD7
            </div>

        </div>

        <div class="wallet-arrow">
            ›
        </div>

    </div>


    <!-- LEVEL -->

    <div class="level">

        <div class="level-title">
            LVL 3
        </div>

        <div class="level-bar">

            <div class="level-bar-fill"></div>

        </div>

        <div class="level-count">
            348 / 1,000
        </div>

    </div>


</div>



<!-- ======================================================
     BRAND
======================================================= -->

<div class="brand">

    <div class="brand-row">

        <div class="brand-moon"></div>

        <div>

            <div class="brand-name">
                LUNARO
            </div>

            <div class="brand-sub">
                AUTOMATIC MINING
            </div>

        </div>

    </div>

</div>



<!-- ======================================================
     HERO
======================================================= -->

<section class="hero">

    <div class="hero-glow"></div>

    <div class="back-ring"></div>

    <div class="planet"></div>

    <div class="orbit"></div>

    <div class="hero-lnr">
        LNR
    </div>

</section>



<!-- ======================================================
     TOTAL BALANCE
======================================================= -->

<section class="total">

    <div class="total-title">
        TOTAL BALANCE ⓘ
    </div>

    <div
        id="totalBalance"
        class="total-number">
        25,000.00
    </div>

    <div class="total-token">

        <span class="token-icon">
            L
        </span>

        LNR

    </div>

</section>



<!-- ======================================================
     STATS
======================================================= -->

<section class="stats">


    <!-- WALLET -->

    <div class="stat">

        <div class="stat-icon">
            ◈
        </div>

        <div class="stat-name">
            WALLET BALANCE
        </div>

        <div
            id="walletBalance"
            class="stat-value">
            25,000.00
        </div>

        <div class="stat-unit">
            LNR
        </div>

    </div>


    <!-- MINED -->

    <div class="stat">

        <div class="stat-icon">

<script>

/* =========================================================
   LUNARO DEMO ENGINE
========================================================= */


/* ---------------------------------------------------------
   INITIAL DATA
--------------------------------------------------------- */

let walletBalance = 25000;

let minedBalance = 458.72;


/*
    0.70 LNR per hour
*/

const miningSpeed = 0.70;

let lastMiningUpdate = Date.now();


/* ---------------------------------------------------------
   FORMAT
--------------------------------------------------------- */

function formatNumber(value){

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:4
        }
    );

}


/* ---------------------------------------------------------
   UPDATE SCREEN
--------------------------------------------------------- */

function updateScreen(){

    /*
       IMPORTANT:

       Mined balance is NOT included
       in Total Balance until Claim.
    */

    document.getElementById(
        "walletBalance"
    ).textContent =
        formatNumber(walletBalance);


    document.getElementById(
        "minedBalance"
    ).textContent =
        formatNumber(minedBalance);


    document.getElementById(
        "totalBalance"
    ).textContent =
        formatNumber(walletBalance);


    document.getElementById(
        "speed"
    ).textContent =
        miningSpeed.toFixed(2);

}


/* ---------------------------------------------------------
   AUTOMATIC MINING
--------------------------------------------------------- */

function updateMining(){

    const now = Date.now();

    const elapsed =
        (now - lastMiningUpdate)
        / 3600000;


    if(elapsed > 0){

        minedBalance +=
            miningSpeed * elapsed;

    }


    lastMiningUpdate = now;

    updateScreen();

}


/* ---------------------------------------------------------
   CLAIM
--------------------------------------------------------- */

document
.getElementById("claimButton")
.addEventListener(
    "click",
    function(){

        updateMining();


        if(minedBalance <= 0){

            return;

        }


        /*
            CLAIM LOGIC

            mined -> wallet

            after claim:

            Wallet Balance increases
            Mined becomes zero
            Total increases
        */

        walletBalance += minedBalance;

        minedBalance = 0;

        lastMiningUpdate = Date.now();


        updateScreen();

    }
);


/* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */

document
.querySelectorAll(".nav-item")
.forEach(
    function(item){

        item.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".nav-item"
                )
                .forEach(
                    function(nav){

                        nav.classList.remove(
                            "active"
                        );

                    }
                );


                item.classList.add(
                    "active"
                );

            }
        );

    }
);


/* ---------------------------------------------------------
   INITIAL
--------------------------------------------------------- */

updateScreen();


/* ---------------------------------------------------------
   LIVE MINING
--------------------------------------------------------- */

setInterval(
    updateMining,
    1000
);

</script>
