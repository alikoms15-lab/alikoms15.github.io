<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUNARO — LNR Mining</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@3.0.2/dist/tonconnect-ui.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f59b;
      --primary-glow: rgba(0, 245, 155, 0.45);
      --primary-dark: #00b371;
      --gold-btn-top: #ffe259;
      --gold-btn-bottom: #ffa700;
      --gold-shadow: rgba(255, 195, 18, 0.45);
      --bg-dark: #020907;
      --bg-card: rgba(0, 24, 18, 0.72);
      --border-card: rgba(0, 245, 155, 0.28);
      --text-muted: #96aca7;
      --text-dim: #5c7873;
      --font-main: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: var(--font-main);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 960px;
      background: #020907;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 245, 155, 0.12);
    }

    @media (min-width: 500px) and (min-height: 700px) {
      .app-container {
        height: 92vh;
        border-radius: 40px;
        border: 2px solid rgba(0, 245, 155, 0.25);
        box-shadow: 0 0 80px rgba(0, 245, 155, 0.2), 0 25px 50px rgba(0, 0, 0, 0.8);
      }
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 1;
      filter: contrast(1.1) brightness(1.04) saturate(1.05);
      transition: transform 0.4s ease;
    }

    .bg-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(2, 9, 7, 0.4) 0%,
        transparent 15%,
        transparent 70%,
        rgba(2, 9, 7, 0.4) 85%,
        rgba(2, 9, 7, 0.9) 100%
      );
      z-index: 2;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .main-content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 6px;
      overflow: hidden;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar {
      display: none;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .level-compact-card {
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 24, 18, 0.6);
      backdrop-filter: blur(8px);
      padding: 4px 10px 4px 5px;
      border-radius: 20px;
      border: 1px solid rgba(0, 245, 155, 0.25);
    }

    .level-gem-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--primary);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(0, 245, 155, 0.4);
    }

    .level-gem-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .level-text-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .level-title-small {
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
    }

    .progress-track-slim {
      width: 55px;
      height: 4px;
      background: #092c22;
      border-radius: 6px;
      overflow: hidden;
      border: 0.5px solid rgba(0, 245, 155, 0.35);
    }

    .progress-fill-slim {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f59b 0%, #00d287 100%);
      border-radius: 6px;
      box-shadow: 0 0 6px rgba(0, 245, 155, 0.8);
    }

    .progress-text-small {
      font-size: 11px;
      font-weight: 700;
      color: #9fe2d3;
    }

    .wallet-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: rgba(0, 22, 17, 0.75);
      backdrop-filter: blur(8px);
      border: 1.2px solid rgba(0, 245, 155, 0.4);
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 245, 155, 0.12);
      transition: all 0.25s;
    }

    .wallet-chip:hover {
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.3);
    }

    .wallet-chip:active {
      transform: scale(0.96);
    }

    .wallet-icon-svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
      display: flex;
      align-items: center;
    }

    .wallet-address {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .wallet-chevron {
      color: #88a7a0;
      display: flex;
      align-items: center;
    }

    .balance-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 4px;
      position: relative;
      z-index: 6;
    }

    .balance-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #a4beba;
      margin-bottom: 5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .total-balance-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 5px 20px;
      background: rgba(0, 20, 15, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 155, 0.4);
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.15), inset 0 0 10px rgba(0, 245, 155, 0.08);
    }

    .gold-coin-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      object-fit: cover;
      display: block;
    }

    .total-number {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .currency-tag {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 245, 155, 0.6);
    }

    .stats-card {
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      background: rgba(0, 22, 17, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 155, 0.25);
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .stat-col {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 2px 6px;
    }

    .stat-col:first-child {
      border-right: 1px solid rgba(0, 245, 155, 0.18);
    }

    .stat-icon-wrap {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      filter: drop-shadow(0 0 5px rgba(0, 245, 155, 0.5));
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-name {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #8faea8;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }

    .stat-ticker {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary);
    }

    .hero-stage {
      position: relative;
      flex: 1;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .coin-interactive-wrap {
      position: relative;
      width: min(72vw, 320px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-coin {
      width: min(62vw, 270px);
      height: min(62vw, 270px);
      object-fit: contain;
      border-radius: 50%;
      display: block;
      filter: drop-shadow(0 18px 35px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 24px rgba(0, 245, 155, 0.18));
      animation: coinFloat 6.5s ease-in-out infinite;
      transform: translateZ(0);
      will-change: transform;
    }

    @keyframes coinFloat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }

    .help-glass-orb {
      position: absolute;
      left: 8px;
      top: 14%;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      animation: orbFloat 3.2s ease-in-out infinite alternate;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
    }

    @keyframes orbFloat {
      0% {
        transform: translateY(0px) rotate(0deg);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.15), 0 6px 14px rgba(0, 0, 0, 0.4);
      }
      50% {
        transform: translateY(-6px) rotate(-3deg);
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.3), 0 10px 20px rgba(0, 0, 0, 0.5);
      }
      100% {
        transform: translateY(3px) rotate(2deg);
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.18), 0 8px 16px rgba(0, 0, 0, 0.4);
      }
    }

    .help-glass-orb-inner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.2) 22%, rgba(15, 22, 20, 0.95) 60%, #030806 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .help-glass-orb-inner span {
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }

    .help-glass-orb:hover {
      animation-play-state: paused;
      transform: scale(1.1);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.4);
    }

    .help-glass-orb:active {
      transform: scale(0.94);
    }

    .live-mining-card {
      width: 100%;
      background: rgba(0, 22, 16, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(0, 245, 155, 0.38);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-bottom: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 245, 155, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .live-mining-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 155, 0.6), transparent);
    }

    .live-mining-header {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pulse-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      animation: pulseDot 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 14px var(--primary); }
    }

    .live-mining-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #9fe2d3;
      text-transform: uppercase;
    }

    .live-mining-main-val {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }

    .live-mining-symbol {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .live-mining-digits {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 0 16px rgba(0, 245, 155, 0.35);
    }

    .live-mining-unit {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 245, 155, 0.5);
    }

    .claim-container {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 0 2px 8px;
    }

    .claim-btn-gold {
      position: relative;
      width: 100%;
      height: 54px;
      background: linear-gradient(180deg, var(--gold-btn-top) 0%, var(--gold-btn-bottom) 100%);
      border: 1.5px solid #ffe97d;
      border-radius: 18px;
      color: #1a1200;
      font-family: var(--font-main);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      box-shadow: 
        0 0 28px var(--gold-shadow),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.7),
        inset 0 -2px 4px rgba(120, 75, 0, 0.5);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }

    .claim-btn-gold::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.35) 50%,
        transparent 70%
      );
      transform: rotate(25deg);
      animation: buttonShine 4s infinite linear;
      pointer-events: none;
    }

    @keyframes buttonShine {
      0% { transform: translateX(-100%) rotate(25deg); }
      25% { transform: translateX(100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    .claim-btn-gold:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px var(--gold-shadow);
    }

    .bottom-nav {
      position: relative;
      z-index: 10;
      height: 64px;
      background: rgba(1, 10, 8, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0, 245, 155, 0.22);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0 6px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .nav-icon-container {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }

    .nav-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item.active .nav-icon-container {
      filter: drop-shadow(0 0 8px var(--primary));
      transform: translateY(-2px);
    }

    .nav-item.active .nav-label {
      color: var(--primary);
      text-shadow: 0 0 8px rgba(0, 245, 155, 0.4);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 38px;
      height: 3px;
      background: var(--primary);
      border-radius: 4px 4px 0 0;
      box-shadow: 0 0 12px var(--primary);
    }

    .nav-item.special-btn .nav-icon-container {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 245, 155, 0.15);
      border: 1px solid rgba(0, 245, 155, 0.4);
      color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 245, 155, 0.2);
    }

    .toast-msg {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(2, 25, 19, 0.95);
      border: 1.5px solid var(--primary);
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 245, 155, 0.4);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: #021812;
      border: 1.5px solid var(--primary);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 0 50px rgba(0, 245, 155, 0.25);
      position: relative;
      text-align: center;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #96aca7;
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-icon-header {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 245, 155, 0.15);
      border: 1.5px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.3);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-body {
      max-height: 68vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      font-size: 13.5px;
      color: #b1c7c2;
      line-height: 1.55;
      margin-bottom: 18px;
      text-align: left;
    }

    .modal-btn {
      width: 100%;
      height: 46px;
      background: linear-gradient(180deg, #00f59b 0%, #00a86b 100%);
      border: none;
      border-radius: 14px;
      color: #02120d;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 245, 155, 0.35);
      transition: all 0.2s;
    }

    .modal-btn:active {
      transform: scale(0.97);
    }

    .wallet-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .wallet-option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 15px;
      background: rgba(0, 30, 22, 0.7);
      border: 1px solid rgba(0, 245, 155, 0.25);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

  <script>
    const API_URL = "https://lunaro-api.alikoms15.workers.dev";
    const BOT_USERNAME = "LunaroGameBot";
    const MANIFEST_URL = "https://alikoms15-lab.github.io/alikoms15.github.io/tonconnect-manifest.json";
    const tg = window.Telegram?.WebApp || null;

    const stateKey = "lunaro_v7_state";
    const defaultState = {
      pool: 0,
      holding: null,
      mined: 0,
      lastMiningTime: Date.now(),
      telegramName: "",
      telegramId: "",
      username: "",
      level: 1,
      rate: 0.7000,
      referralCode: "LNR000000",
      friends: 0,
      successfulFriends: 0,
      refRewards: 0,
      referralBonuses: 0,
      pendingReferralCode: "",
      history: [],
      dailyClaimDate: ""
    };

    let state = loadState();
    let connectedWallet = "";
    let tonConnectUI = null;
    let tonReady = false;
    let miningSyncTimer = null;
    let fullSyncTimer = null;
    let miningSyncBusy = false;
    let displayMinedBase = 0;
    let displayMinedAt = Date.now();
    let toastTimeout;

    const totalBalanceEl = document.getElementById('totalBalance');
    const holdingWalletAmountEl = document.getElementById('holdingWalletAmount');
    const walletBalanceEl = document.getElementById('walletBalance');
    const liveMinedCounterEl = document.getElementById('liveMinedCounter');
    const btnClaim = document.getElementById('btnClaim');
    const btnHelpGuide = document.getElementById('btnHelpGuide');
    const toastMsg = document.getElementById('toastMsg');
    const toastText = document.getElementById('toastText');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalIcon = document.getElementById('modalIcon');
    const modalExtra = document.getElementById('modalExtraContent');
    const btnModalClose = document.getElementById('btnModalClose');
    const btnModalAction = document.getElementById('btnModalAction');
    const walletChip = document.getElementById('walletChip');
    const walletAddressDisplay = document.getElementById('walletAddressDisplay');
    const levelTitleEl = document.getElementById('levelTitle');
    const levelProgressFillEl = document.getElementById('levelProgressFill');
    const levelProgressTextEl = document.getElementById('levelProgressText');

    function loadState(){
      try{
        const raw = localStorage.getItem(stateKey);
        return {...defaultState, ...(raw ? JSON.parse(raw) : {})};
      }catch(e){ return {...defaultState}; }
    }
    function saveState(){
      try{ localStorage.setItem(stateKey, JSON.stringify(state)); }catch(e){}
    }
    function fmt(n, decimals=2){
      return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
    }
    function shortAddress(a){ return a ? `${a.slice(0,6)}...${a.slice(-4)}` : 'CONNECT WALLET'; }
    function showToast(message){
      if(!toastMsg || !toastText) return;
      toastText.textContent = message;
      toastMsg.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(()=>toastMsg.classList.remove('show'),2200);
    }

    function getStartParam(){
      try{
        return String(tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('startapp') || new URLSearchParams(location.search).get('start') || '').trim();
      }catch(e){ return ''; }
    }

    function initTelegram(){
      try{
        if(tg){ tg.ready(); if(typeof tg.expand==='function') tg.expand(); }
        const startParam=getStartParam();
        if(startParam && !state.pendingReferralCode) state.pendingReferralCode=startParam;
        const u = tg?.initDataUnsafe?.user;
        if(u){
          state.telegramId = String(u.id || '');
          state.username = u.username || '';
          state.telegramName = [u.first_name,u.last_name].filter(Boolean).join(' ') || state.username || 'User';
        }
      }catch(e){}
      if(!state.telegramId) state.telegramId = 'demo-user';
      if(!state.telegramName) state.telegramName = 'User';
      saveState();
    }

    async function initTonConnect(){
      if(tonReady) return tonConnectUI;
      if(!window.TON_CONNECT_UI?.TonConnectUI) return null;
      try{
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({manifestUrl: MANIFEST_URL, analytics:{mode:'off'}});
        tonConnectUI.onStatusChange(async wallet=>{
          const address = wallet?.account?.address || '';
          if(address) await setConnectedWallet(address,false);
          else await setConnectedWallet('',false);
        });
        if(typeof tonConnectUI.connectionRestored !== 'undefined'){
          try{ await tonConnectUI.connectionRestored; }catch(e){}
        }else if(typeof tonConnectUI.restoreConnection==='function'){
          try{ await tonConnectUI.restoreConnection(); }catch(e){}
        }
        tonReady = true;
        return tonConnectUI;
      }catch(e){
        console.warn('TonConnect init failed',e);
        tonConnectUI=null; tonReady=false; return null;
      }
    }

    async function setConnectedWallet(address, resetMiningTime=true){
      connectedWallet = address || '';
      if(connectedWallet){
        if(resetMiningTime){ state.lastMiningTime = Date.now(); }
        updateWalletUI();
        startMiningDisplay();
        startMiningSync();
        startFullSync();
        await syncMiningFromServer();
        await loadUser();
      }else{
        stopMiningDisplay();
        stopMiningSync();
        stopFullSync();
        updateWalletUI();
      }
      saveState(); updateUI();
    }

    function updateWalletUI(){
      if(walletAddressDisplay) walletAddressDisplay.textContent = shortAddress(connectedWallet);
      if(walletChip) walletChip.classList.toggle('connected',!!connectedWallet);
    }

    async function connectWallet(){
      const ui = await initTonConnect();
      if(!ui){ showToast('سیستم اتصال کیف پول آماده نیست'); return; }
      try{ await ui.openModal(); }catch(e){ showToast('صفحه اتصال کیف پول باز نشد'); }
    }
    async function disconnectWallet(){
      try{ if(tonConnectUI?.disconnect) await tonConnectUI.disconnect(); }catch(e){}
      connectedWallet=''; stopMiningDisplay(); stopMiningSync(); stopFullSync(); updateWalletUI(); updateUI();
    }

    async function syncMiningFromServer(){
      if(miningSyncBusy || !connectedWallet || !state.telegramId) return;
      miningSyncBusy=true;
      try{
        const response=await fetch(API_URL+'/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:state.telegramId,wallet:connectedWallet})});
        const data=await response.json();
        if(response.ok && data.success && data.user){
          const serverMined=Number(data.user.mined||0);
          const previousMined=Number(state.mined||0);

          // Mining can only increase during normal operation. A decrease to
          // zero is allowed only through the explicit Claim flow. This prevents
          // a stale /mine response or a temporary sync race from wiping the
          // user's unclaimed reward and restarting the counter.
          if(serverMined >= previousMined){
            applyServerUser(data.user);
            displayMinedBase=serverMined;
            displayMinedAt=Date.now();
            state.mined=serverMined;
            saveState();
          }else{
            // Keep the last valid local unclaimed amount while the backend
            // catches up. Still refresh the other server fields.
            const keepMined=previousMined;
            applyServerUser({...data.user,mined:keepMined});
            displayMinedBase=Math.max(keepMined,displayMinedBase);
            displayMinedAt=Date.now();
            state.mined=keepMined;
            saveState();
          }
        }
      }catch(error){ console.warn('Mining sync failed:',error); }
      finally{ miningSyncBusy=false; }
    }

    function applyServerUser(user){
      state.pool=Number(user.balance ?? state.pool ?? 0);
      state.mined=Number(user.mined ?? state.mined ?? 0);
      state.level=Number(user.level ?? state.level ?? 1);
      state.rate=Number(user.mining_rate ?? state.rate ?? 0.7);
      if(user.referral_code) state.referralCode=user.referral_code;
      if(user.referral_count!=null) state.friends=Number(user.referral_count||0);
      if(user.successful_referrals!=null) state.successfulFriends=Number(user.successful_referrals||0);
      if(user.referral_earnings!=null) state.refRewards=Number(user.referral_earnings||0);
      if(user.referral_bonuses!=null) state.referralBonuses=Number(user.referral_bonuses||0);
      if(Array.isArray(user.withdrawal_history)) state.history=user.withdrawal_history;
      if(user.holding!=null && Number.isFinite(Number(user.holding))) state.holding=Number(user.holding);
    }

    async function loadUser(){
      if(!state.telegramId) return;
      try{
        const response=await fetch(API_URL+'/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:state.telegramId,username:state.username,first_name:state.telegramName,wallet:connectedWallet||'',referral_code:state.pendingReferralCode||'',referral_action:connectedWallet?'wallet_verified':'enter'})});
        const data=await response.json();
        if(response.ok && data.success && data.user){
          // Do not overwrite Unclaimed Mined from the periodic /user sync.
          // /mine is the mining synchronizer and Claim is the only operation
          // that is allowed to reset mined to zero. This prevents a stale /user
          // response from making the counter jump back to zero.
          const keepMined=Number(state.mined||0);
          applyServerUser({...data.user,mined:keepMined});
          displayMinedBase=Math.max(keepMined,displayMinedBase);
          displayMinedAt=Date.now();
          state.mined=keepMined;
          saveState(); updateUI();
        }
      }catch(e){ console.warn('User load failed:',e); }
    }

    function startMiningSync(){
      stopMiningSync();
      miningSyncTimer=setInterval(syncMiningFromServer,1000);
    }
    function stopMiningSync(){ if(miningSyncTimer){clearInterval(miningSyncTimer);miningSyncTimer=null;} }
    function startFullSync(){
      stopFullSync();
      fullSyncTimer=setInterval(loadUser,20000);
    }
    function stopFullSync(){ if(fullSyncTimer){clearInterval(fullSyncTimer);fullSyncTimer=null;} }
    function startMiningDisplay(){
      if(!window.__lunaroMiningDisplay){
        window.__lunaroMiningDisplay=setInterval(updateMiningDisplay,100);
      }
      displayMinedBase=Number(state.mined||0);
      displayMinedAt=Date.now();
    }
    function stopMiningDisplay(){
      if(window.__lunaroMiningDisplay){clearInterval(window.__lunaroMiningDisplay);window.__lunaroMiningDisplay=null;}
    }
    function updateMiningDisplay(){
      if(!connectedWallet) return;
      const elapsed=Math.max(0,Date.now()-displayMinedAt);
      const liveMined=displayMinedBase+(elapsed/3600000)*Number(state.rate||0.7);
      if(liveMinedCounterEl) liveMinedCounterEl.textContent=liveMined.toFixed(5);
    }

    function levelThreshold(level){
      // Level progression is based on the same fixed LNR requirements used by Miners.
      // Level 1 starts at 0 LNR; Level 2+ use levelRequiredLNR().
      if(level<=1) return 0;
      return typeof levelRequiredLNR==='function' ? Number(levelRequiredLNR(level))||0 : 0;
    }
    function levelRate(level){ return 0.70+(level-1)*0.05; }
    function updateLevel(){
      // Total Assets = Pool Wallet + Holding Wallet.
      // Level 1 is the starting level. Level 2 requires exactly 10,000 LNR.
      // Every next level adds another 10,000 LNR to the total requirement.
      const totalAssets=minersTotalAssets();
      let level=1;
      for(let i=2;i<=1000;i++){
        const required=levelRequiredLNR(i);
        if(totalAssets>=required) level=i;
        else break;
      }
      state.level=level;
      state.rate=levelRate(level);
    }

    function updateUI(){
      updateLevel();
      const pool=Number(state.pool||0);
      const holding=Number(state.holding);
      const total=pool+(Number.isFinite(holding)?holding:0);
      if(totalBalanceEl) totalBalanceEl.textContent=fmt(total);
      if(walletBalanceEl) walletBalanceEl.textContent=fmt(pool);
      if(holdingWalletAmountEl) holdingWalletAmountEl.textContent=Number.isFinite(holding)?fmt(holding):'—';
      if(liveMinedCounterEl){
        const live=connectedWallet ? displayMinedBase+((Date.now()-displayMinedAt)/3600000)*Number(state.rate||0.7) : Number(state.mined||0);
        liveMinedCounterEl.textContent=live.toFixed(5);
      }
      if(levelTitleEl) levelTitleEl.textContent=`Level ${state.level}`;
      const currentLevel=Math.max(1,Math.min(1000,Number(state.level)||1));
      const nextLevel=currentLevel<1000 ? currentLevel+1 : 1000;
      const nextRequired=typeof levelRequiredLNR==='function' ? Number(levelRequiredLNR(nextLevel))||0 : 0;
      // Progress is measured only toward the NEXT level.
      // Example: Level 1 + 250 LNR toward the 500 LNR Level 2 requirement = 50%.
      const progress=currentLevel>=1000 ? 100 : (nextRequired>0 ? Math.min(100,Math.max(0,(total/nextRequired)*100)) : 0);
      if(levelProgressFillEl) levelProgressFillEl.style.width=`${progress.toFixed(1)}%`;
      if(levelProgressTextEl) levelProgressTextEl.textContent=`${Math.round(progress)}%`;
      if(btnClaim) btnClaim.disabled=!connectedWallet || Number(state.mined||0)<=0;
      updateWalletUI();
    }

    async function claimMining(){
      if(!connectedWallet){showToast('ابتدا کیف پول را متصل کنید');return;}
      if(!state.telegramId){showToast('حساب تلگرام هنوز آماده نیست');return;}
      if(btnClaim) btnClaim.disabled=true;
      try{
        await syncMiningFromServer();
        const response=await fetch(API_URL+'/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:state.telegramId,wallet:connectedWallet})});
        const data=await response.json();
        if(!response.ok || !data.success || !data.user) throw new Error(data.error||'Claim failed');
        const claimed=Number(data.claimed||0);
        applyServerUser(data.user);
        state.lastMiningTime=Date.now();
        displayMinedBase=Number(data.user.mined||0);
        displayMinedAt=Date.now();
        state.mined=Number(data.user.mined||0);
        saveState(); updateUI();
        showToast(`Claimed ${fmt(claimed,5)} LNR`);
      }catch(error){ console.error('Claim error:',error); showToast(error.message||'Claim failed'); updateUI(); }
    }
    btnClaim?.addEventListener('click',claimMining);

    async function completeDailyTask(){
      const today=new Date().toISOString().slice(0,10);
      if(state.dailyClaimDate===today){showToast('امروز این پاداش را گرفته‌اید');return;}
      state.pool=Number(state.pool||0)+3;
      state.dailyClaimDate=today; saveState(); updateUI(); showToast('+3 LNR');
    }

    async function requestWithdrawal(){
      if(!connectedWallet){showToast('ابتدا کیف پول را متصل کنید');return;}
      if(!state.telegramId){showToast('حساب تلگرام آماده نیست');return;}
      if(Number(state.pool)<500){showToast('حداقل برداشت 500 LNR است');return;}
      try{
        const response=await fetch(API_URL+'/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_id:state.telegramId,wallet:connectedWallet,amount:500})});
        const data=await response.json();
        if(!response.ok || !data.success) throw new Error(data.error||'Withdrawal failed');
        applyServerUser(data.user||{}); state.pool=Math.max(0,Number(state.pool)-500); saveState(); updateUI();
        showToast('برداشت ثبت شد: 430 LNR پس از کارمزد 70');
      }catch(e){showToast(e.message||'درخواست برداشت ثبت نشد');}
    }

    function referralLink(){
      if(!BOT_USERNAME || !state.referralCode) return '';
      return `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(state.referralCode)}`;
    }

    async function copyReferralLink(){
      const link=referralLink();
      if(!link){ showToast('نام کاربری ربات هنوز در کد تنظیم نشده است'); return; }
      try{
        if(navigator.clipboard){ await navigator.clipboard.writeText(link); showToast('لینک دعوت کپی شد'); }
        else showToast(link);
      }catch(e){ showToast('کپی لینک انجام نشد'); }
    }

    /* LUNARO MINERS — ATF-style level cards / LNR holding unlock UI */
    function levelRequiredLNR(level){
      level=Math.max(1,Math.floor(Number(level)||1));
      // Level 1 starts at zero requirement.
      // Level 2 = 10,000 LNR; each following level adds 10,000 LNR.
      // Level 1000 = 9,990,000 LNR.
      if(level<=1) return 0;
      return 500*(level-1);
    }
    function demoReferencePrice(){
      // UI preview only. Later this value will come from the backend price engine / market average.
      return 0.0008;
    }
    function minersTotalAssets(){
      const pool=Number(state.pool||0);
      const holding=Number(state.holding);
      return pool+(Number.isFinite(holding)?holding:0);
    }
    function moneyFromLNR(amount){ return Number(amount||0)*demoReferencePrice(); }
    function minersCard(level){
      const required=levelRequiredLNR(level);
      const assets=minersTotalAssets();
      const active=Number(state.level||1)===level;
      const unlocked=assets>=required;
      const missing=Math.max(0,required-assets);
      const rate=levelRate(level);
      const price=moneyFromLNR(required);
      const missingUsd=moneyFromLNR(missing);
      let action='LOCKED';
      let cls='locked';
      if(active){ action='ACTIVE'; cls='active'; }
      else if(unlocked){ action='UNLOCK'; cls='unlock'; }
      else { action=`NEED ${fmt(missing,0)} LNR`; cls='need'; }
      return `<div class="miner-level-card ${cls}" data-miner-level="${level}">
        <div class="miner-card-head"><span>Level ${level}</span><span class="miner-card-price">$${price.toFixed(2)}</span></div>
        <div class="miner-card-speed">${rate.toFixed(2)} LNR/h</div>
        <button class="miner-card-action ${cls}">${action}</button>
        ${(!active && !unlocked && level===Number(state.level||1)+1)?`<div class="miner-card-missing">≈ $${missingUsd.toFixed(2)} to unlock</div>`:''}
      </div>`;
    }
    function renderMinersPage(){
      const current=Math.max(1,Math.min(1000,Number(state.level)||1));
      // فقط Level فعلی و Levelهای بعدی تا 1000 نمایش داده می‌شوند؛ Levelهای پشت سر گذاشته‌شده حذف می‌شوند.
      const start=current;
      const end=1000;
      const cards=[];
      for(let i=start;i<=end;i++) cards.push(minersCard(i));
      modalBody.innerHTML=`<div class="miners-screen" dir="ltr">
        <div class="miners-topbar"><div><b>Miners</b><span> LNR LEVELS</span></div><div class="miners-assets">${fmt(minersTotalAssets(),0)} LNR</div></div>
        <div class="miners-grid">${cards.join('')}</div>
      </div>`;
      modalExtra.innerHTML=`<div class="miners-price-note">Reference price preview: <b>$${demoReferencePrice().toFixed(4)}</b> / LNR<br><span>قیمت نهایی بعداً از سیستم قیمت مرجع بازار خوانده می‌شود.</span></div>`;
      setTimeout(()=>{
        modalBody.querySelectorAll('.miner-level-card').forEach(card=>card.addEventListener('click',()=>openMinerLevel(Number(card.dataset.minerLevel))));
      },0);
    }
    function openMinerLevel(level){
      const required=levelRequiredLNR(level);
      const assets=minersTotalAssets();
      const missing=Math.max(0,required-assets);
      const ref=demoReferencePrice();
      const requiredUsd=required*ref;
      const missingUsd=missing*ref;
      const active=Number(state.level||1)===level;
      const unlocked=assets>=required;
      modalTitle.textContent=`Lvl ${level}`;
      modalBody.innerHTML=`<div class="miner-detail" dir="ltr">
        <div class="miner-detail-price">$${requiredUsd.toFixed(2)}</div>
        <div class="miner-detail-speed"><span>Mining Speed</span><b>${levelRate(level).toFixed(2)} LNR/h</b></div>
        <div class="miner-detail-row"><span>Required Holding</span><b>${fmt(required,0)} LNR ($${requiredUsd.toFixed(2)})</b></div>
        <div class="miner-detail-row"><span>Your Assets</span><b>${fmt(assets,0)} LNR ($${moneyFromLNR(assets).toFixed(2)})</b></div>
        <div class="miner-detail-row missing"><span>Missing</span><b>${fmt(missing,0)} LNR ($${missingUsd.toFixed(2)})</b></div>
        <div class="miner-detail-note">Wallet holding + pool wallet</div>
        <div class="miner-detail-note">قیمت دلار فقط برای نمایش ارزش تقریبی است؛ شرط Level بر اساس تعداد LNR است.</div>
      </div>`;
      modalExtra.innerHTML=`<button class="modal-btn" id="minerBuyBtn">${active?'ACTIVE':(unlocked?'BUY LEVEL '+level:'BUY LEVEL '+level)}</button>`;
      modalOverlay.classList.add('active');
      setTimeout(()=>{
        document.getElementById('minerBuyBtn')?.addEventListener('click',()=>{
          if(active){ showToast(`Level ${level} فعال است`); return; }
          if(unlocked){ showToast(`Level ${level} آماده فعال‌سازی است`); return; }
          // Placeholder only: later connect this action to the real Swap page/router.
          modalOverlay.classList.remove('active');
          openSwapPlaceholder(level, missing, missingUsd);
        });
      },0);
    }

    function openSwapPlaceholder(level, missing, missingUsd){
      modalTitle.textContent='Swap';
      modalBody.innerHTML=`<div style="direction:rtl;text-align:center;color:#d2e5e1;line-height:1.9">
        <div style="font-size:24px;font-weight:800;color:#f3d66d;margin-bottom:10px">Swap LNR</div>
        <div>برای Level ${level} حدود <b style="color:#fff">${fmt(missing,0)} LNR</b> نیاز دارید.</div>
        <div style="margin-top:8px;color:#9fb4af">ارزش تقریبی: <b style="color:#f3d66d">$${missingUsd.toFixed(2)} USDT</b></div>
        <div style="margin-top:14px;padding:12px;border:1px solid rgba(0,245,155,.25);border-radius:14px;background:rgba(0,30,22,.6);font-size:11px">صفحه Swap فعلاً به‌صورت جای‌نگهدار است. بعداً لینک/Router واقعی Swap اینجا متصل می‌شود.</div>
      </div>`;
      modalExtra.innerHTML='<button class="modal-btn" id="swapBackBtn">Back to Miners</button>';
      btnModalAction.textContent='Close';
      btnModalAction.onclick=()=>modalOverlay.classList.remove('active');
      modalOverlay.classList.add('active');
      setTimeout(()=>document.getElementById('swapBackBtn')?.addEventListener('click',()=>renderMinersPage()),0);
    }

    function openSectionModal(tab){
      const titles={tasks:'Tasks',miners:'Miners',friends:'Friends',profile:'Profile'};
      modalTitle.textContent=titles[tab]||tab;
      modalExtra.innerHTML='';
      btnModalAction.textContent='Close';
      btnModalAction.onclick=()=>modalOverlay.classList.remove('active');
      if(tab==='tasks'){
        modalBody.innerHTML=`<div style="direction:rtl;text-align:right;color:#d2e5e1"><b>Daily Task</b><p style="margin-top:8px">پاداش روزانه: +3 LNR</p><button class="modal-btn" id="dailyTaskBtn">Claim Daily +3 LNR</button></div>`;
        setTimeout(()=>{document.getElementById('dailyTaskBtn')?.addEventListener('click',completeDailyTask)},0);
      }else if(tab==='miners'){
        renderMinersPage();
      }else if(tab==='friends'){
        const link=referralLink();
        modalBody.innerHTML=`<div style="direction:rtl;text-align:right;color:#d2e5e1;line-height:1.8">
          <b>لینک دعوت شما</b>
          <div style="margin-top:8px;padding:10px 12px;border:1px solid rgba(0,245,155,.28);border-radius:12px;background:rgba(0,30,22,.65);direction:ltr;text-align:left;word-break:break-all;color:var(--primary);font-size:12px">${link||'لینک دعوت بعد از تنظیم نام کاربری ربات ساخته می‌شود.'}</div>
          <br>افراد دعوت‌شده: ${state.friends}
          <br>افراد دعوت‌شده موفق: ${state.successfulFriends||0}
          <br>پاداش ۱۰٪ از Claim: ${fmt(state.refRewards,5)} LNR
          <br>پاداش دعوت موفق: ${fmt(state.referralBonuses || ((state.successfulFriends||0)*500),2)} LNR
          <br><small style="color:#9fb4af">هر دعوت موفق = 500 LNR قابل برداشت + 10٪ از Claimهای فرد دعوت‌شده.</small>
          <br><small style="color:#9fb4af">دعوت موفق فقط زمانی ثبت می‌شود که فرد با لینک شما وارد برنامه شود و کیف پول TON خود را متصل و احراز کند.</small>
        </div>`;
        modalExtra.innerHTML=`<button class="modal-btn" id="shareRefBtn">ارسال لینک دعوت</button><button class="modal-btn" id="copyRefBtn" style="margin-top:10px;background:rgba(0,245,155,.15);color:#fff;border:1px solid rgba(0,245,155,.35)">کپی لینک دعوت</button>`;
        setTimeout(()=>{
          document.getElementById('shareRefBtn')?.addEventListener('click',async()=>{try{
            if(!link){showToast('لینک دعوت هنوز آماده نیست');return;}
            const shareUrl=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('با لینک دعوت من وارد LUNARO شو')}`;
            if(navigator.share){
              await navigator.share({title:'LUNARO',text:'با لینک دعوت من وارد LUNARO شو',url:link});
            }else if(tg?.openTelegramLink){
              tg.openTelegramLink(shareUrl);
            }else if(navigator.clipboard){
              await navigator.clipboard.writeText(link);
              showToast('لینک دعوت کپی شد');
            }
          }catch(e){
            try{ if(navigator.share) await navigator.share({title:'LUNARO',text:'با لینک دعوت من وارد LUNARO شو',url:link}); }
            catch(e2){ showToast('اشتراک‌گذاری انجام نشد'); }
          }});
          document.getElementById('copyRefBtn')?.addEventListener('click',copyReferralLink);
        },0);
      }else if(tab==='profile'){
        const hist=Array.isArray(state.history)?state.history:[];
        modalBody.innerHTML=`<div style="direction:rtl;text-align:right;color:#d2e5e1;line-height:1.8"><b>Wallet:</b><br><span style="direction:ltr;display:inline-block;word-break:break-all">${connectedWallet||'Not connected'}</span><br><br><b>Pool Wallet:</b> ${fmt(state.pool)} LNR<br><b>Holding Wallet:</b> ${Number.isFinite(Number(state.holding))?fmt(state.holding):'—'} LNR<br><b>Total Assets:</b> ${fmt(Number(state.pool)+(Number(state.holding)||0))} LNR</div>`;
        modalExtra.innerHTML=`<button class="modal-btn" id="withdrawBtn">Withdraw 500 LNR</button><div style="margin-top:12px;direction:rtl;text-align:right;color:#9fb4af;font-size:12px"><b style="color:#fff">Withdrawal History</b>${hist.length?hist.slice(0,5).map(x=>`<div style="padding:6px 0;border-bottom:1px solid rgba(0,245,155,.12)">${x.status||'pending'} — ${x.amount||500} LNR</div>`).join(''):'<div style="padding-top:7px">هنوز برداشت ثبت نشده است.</div>'}</div>`;
        setTimeout(()=>document.getElementById('withdrawBtn')?.addEventListener('click',requestWithdrawal),0);
      }
      modalOverlay.classList.add('active');
    }

    walletChip?.addEventListener('click',async()=>{
      modalIcon.innerHTML='<span style="font-size:20px">💎</span>';
      modalTitle.textContent=connectedWallet?'TON Wallet Connected':'Connect TON Wallet';
      modalBody.innerHTML=connectedWallet?`<div style="direction:ltr;word-break:break-all;text-align:center">${connectedWallet}</div>`:'<div style="direction:rtl;text-align:center">برای شروع Mining باید کیف پول TON را متصل کنید.</div>';
      modalExtra.innerHTML='';
      btnModalAction.textContent=connectedWallet?'Disconnect Wallet':'Connect Wallet';
      btnModalAction.onclick=connectedWallet?disconnectWallet:connectWallet;
      modalOverlay.classList.add('active');
    });

    btnHelpGuide?.addEventListener('click',()=>{
      modalTitle.textContent='راهنمای LUNARO';
      modalBody.innerHTML='<div style="direction:rtl;text-align:right;color:#d2e5e1;line-height:1.8">استخراج به‌صورت خودکار انجام می‌شود. مقدار ماین‌شده در Unclaimed باقی می‌ماند و فقط بعد از Claim به Pool Wallet منتقل شده و Total Assets را افزایش می‌دهد. سرعت Mining بر اساس Level محاسبه می‌شود.</div>';
      modalExtra.innerHTML=''; btnModalAction.textContent='متوجه شدم'; btnModalAction.onclick=()=>modalOverlay.classList.remove('active'); modalOverlay.classList.add('active');
    });

    document.querySelector('.level-compact-card')?.addEventListener('click',()=>{
      document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
      document.querySelector('.nav-item[data-tab="miners"]')?.classList.add('active');
      openSectionModal('miners');
    });

    document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
      const tab=btn.dataset.tab; if(tab==='mine'){modalOverlay.classList.remove('active'); updateUI();} else openSectionModal(tab);
    }));
    btnModalClose?.addEventListener('click',()=>modalOverlay.classList.remove('active'));
    modalOverlay?.addEventListener('click',e=>{if(e.target===modalOverlay) modalOverlay.classList.remove('active')});

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) syncMiningFromServer();
      else if(connectedWallet){ syncMiningFromServer(); loadUser(); }
    });

    initTelegram();
    updateUI();
    initTonConnect().then(()=>updateUI());
</script>
</body>
</html>
